name: Daily Wins Fetch

on:
  schedule:
    # Run daily at 11:00 UTC (6:00 AM EST / 7:00 AM EDT)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-wins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch daily wins
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: npx tsx scripts/fetch-daily-wins.ts

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet src/content/daily-wins/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "BetTaxCalc Bot"
          git config user.email "bot@bettaxcalc.com"
          DATE=$(date -u +"%Y-%m-%d")
          git add src/content/daily-wins/
          git commit -m "Daily wins: ${DATE}"
          git push
