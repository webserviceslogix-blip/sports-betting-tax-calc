name: Daily Wins Fetch

on:
  schedule:
    # Run daily at 11:00 UTC (6:00 AM EST / 7:00 AM EDT)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-wins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch daily wins
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: npx tsx scripts/fetch-daily-wins.ts

      - name: Check for new or changed files
        id: check_changes
        run: |
          git add src/content/daily-wins/
          git diff --cached --quiet src/content/daily-wins/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "webserviceslogix-blip"
          git config user.email "webserviceslogix@gmail.com"
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "Daily wins: ${DATE}"
          git push

      - name: Ping Google to recrawl sitemap
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          echo "Pinging Google to recrawl sitemap..."
          curl -s "https://www.google.com/ping?sitemap=https://bettaxcalc.com/sitemap.xml" -o /dev/null -w "Google ping: HTTP %{http_code}\n"
          echo "Pinging Bing to recrawl sitemap..."
          curl -s "https://www.bing.com/ping?sitemap=https://bettaxcalc.com/sitemap.xml" -o /dev/null -w "Bing ping: HTTP %{http_code}\n"

      - name: Submit new page to IndexNow (Bing, Yandex, etc.)
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          echo "Submitting new daily wins page to IndexNow..."
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"bettaxcalc.com\",
              \"key\": \"${{ secrets.INDEXNOW_KEY }}\",
              \"urlList\": [
                \"https://bettaxcalc.com/daily-wins\",
                \"https://bettaxcalc.com/daily-wins/${DATE}\",
                \"https://bettaxcalc.com/sitemap.xml\"
              ]
            }" -o /dev/null -w "IndexNow: HTTP %{http_code}\n" || echo "IndexNow submission skipped (no key configured)"
