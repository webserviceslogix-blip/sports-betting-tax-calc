      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo icon -->
  <rect x="60" y="60" width="56" height="56" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="88" y="98" text-anchor="middle" fill="white" font-size="34" font-weight="bold" font-family="system-ui,sans-serif">$</text>

  <!-- Brand name -->
